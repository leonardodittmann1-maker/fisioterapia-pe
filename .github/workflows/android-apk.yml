name: Gerar APK SwipeClean
on:
  push:
    branches: [ swipe-clean-gallery-app ]
    paths-ignore:
      - 'downloads/**'
      - 'updates/version.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar assinatura de depuração
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: swipe-clean-android-signing-v1
      - name: Preparar assinatura quando necessária
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SwipeClean Development, O=Personal, C=BR"
          fi
          keytool -list -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "(SHA256|Alias name)" || true
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar APK e manifesto de atualização
        run: |
          mkdir -p downloads updates
          cp app/build/outputs/apk/debug/app-debug.apk downloads/SwipeClean.apk
          HASH=$(sha256sum downloads/SwipeClean.apk | cut -d' ' -f1)
          cat > updates/version.json <<EOF
          {
            "versionCode": 6,
            "versionName": "1.5.0",
            "notes": "Ao escolher um álbum, abrir fotos diretamente com botões Descartar, Manter e Trocar álbum. Retomada por pasta preservada.",
            "sha256": "$HASH"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SwipeClean.apk updates/version.json
          git commit -m "Publicar APK SwipeClean v1.5.0" || true
          git push origin HEAD:swipe-clean-gallery-app
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-v1.5.0-APK
          path: downloads/SwipeClean.apk
          retention-days: 90
